---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/amd-droplet/resourceset
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      domain: amd-droplet.shubhamtatvamasi.com
      # droplet public IP (eth0), handed to traefik via cilium LB-IPAM
      traefik_lb_ip: 162.243.96.72
      # amd | nvidia — must match the GPU operator enabled in the resourceset
      gpu_vendor: amd
      # RuntimeClass for GPU pods: "nvidia" on NVIDIA (RKE2 creates it), empty on AMD
      gpu_runtime_class: ""
