---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-stack
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/nvidia-dynamo/ai-stack
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      domain: nvidia-dynamo.shubhamtatvamasi.com
      gpu_vendor: nvidia
      # RuntimeClass for GPU pods: "nvidia" (RKE2 creates it)
      gpu_runtime_class: nvidia
