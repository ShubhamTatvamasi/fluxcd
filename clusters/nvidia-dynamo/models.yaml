---
# Models served by NVIDIA Dynamo (DynamoGraphDeployment) on top of the ai-stack
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: models
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/nvidia-dynamo
  targetNamespace: dynamo
  prune: true
  # ai-stack (the ResourceSet) is Ready as soon as it has created its Kustomizations, so also wait on
  # dynamo-platform itself: its operator's crd-apply init container installs the DynamoGraphDeployment CRD
  dependsOn:
    - name: ai-stack
    - name: dynamo-platform
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substitute:
      domain: nvidia-dynamo.shubhamtatvamasi.com
