---
# Models served by NVIDIA Dynamo (DynamoGraphDeployment) on a shared MPS GPU claim, scheduled by KAI
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dynamo-models
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/droplet-dynamo
  prune: true
  # ai-stack (the ResourceSet) is Ready as soon as it has created its Kustomizations, so also wait on
  # dynamo-platform for the DGD CRD and kai-scheduler for the Queue CRD and scheduler
  dependsOn:
    - name: ai-stack
    - name: dynamo-platform
    - name: kai-scheduler
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
