---
# TLS for the model frontends' Ingresses (sealed secret decrypted by sealed-secrets)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dynamo-tls
  namespace: dynamo
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/tls/shubhamtatvamasi-tls
  postBuild:
    substitute:
      tls_secret_name: dynamo-tls
      namespace: dynamo
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
