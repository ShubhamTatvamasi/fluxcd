---
# Qwen3.5-9B (RedHatAI FP8-dynamic weights, ~14 GB) with Dynamo, aggregated serving: one Frontend
# (OpenAI HTTP API, KV-aware router, tokenization) and one vLLM worker doing prefill + decode on the GPU.
# The operator creates Service qwen35-frontend:8000 (/v1/models, /v1/chat/completions); workers
# register themselves through Kubernetes discovery, so no etcd/NATS. LiteLLM serves it as "qwen3.5".
# Sizing for the 20 GB RTX 4000 Ada (sm_89, native FP8): text-only weights take 11.9 GiB, CUDA graphs and
# activations ~4.5 GiB, and the cache gets the rest; one 64k request needs 2.1 GiB (24 of the 32 layers
# are linear attention, so the cache per token is small).
# The worker takes ~95% of the GPU, so the operator's rolling update (new worker up before the old one
# goes) deadlocks on any worker change: remove the DGD from the kustomization first, let Flux prune it,
# then add the new spec back.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen35
  namespace: dynamo
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              # the operator's webhook requires an image with a semver tag on every component
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.1
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
    - name: VllmDecodeWorker
      type: worker
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.5.1
              workingDir: /workspace/examples/backends/vllm
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - RedHatAI/Qwen3.5-9B-FP8-dynamic
                # text only: skip the vision encoder so its memory goes to the cache
                - --language-model-only
                - --max-model-len
                - "65536"
                # the only model on the (time-sliced) GPU; at 0.9 only 1.21 GiB was left for the cache,
                # short of the 2.11 GiB one 64k-token request needs
                - --gpu-memory-utilization
                - "0.95"
                # a handful of concurrent requests (coding assistants), not vLLM's default 256: smaller
                # activation/CUDA-graph workspace leaves more of the GPU for the cache
                - --max-num-seqs
                - "16"
                # Qwen3.5 emits <tool_call><function=...> (qwen3_coder format) and <think>...</think>: parse them
                # into OpenAI tool_calls / reasoning_content instead of returning them as plain text
                - --dyn-tool-call-parser
                - qwen3_coder
                - --dyn-reasoning-parser
                - qwen3
                # answer directly unless a request asks for thinking
                # (chat_template_kwargs: {"enable_thinking": true}); it spent 1500+ tokens on one-line answers
                - --dyn-default-thinking-mode
                - disabled
              env:
                - name: HF_HOME
                  value: /home/dynamo/.cache/huggingface
              # HF_TOKEN for gated models; this one is public, so the secret may be absent:
              #   kubectl -n dynamo create secret generic hf-token-secret --from-literal=HF_TOKEN=<token>
              envFrom:
                - secretRef:
                    name: hf-token-secret
                    optional: true
              volumeMounts:
                - name: model-cache
                  mountPath: /home/dynamo/.cache/huggingface
              resources:
                requests:
                  cpu: "1"
                  memory: 12Gi
                  ephemeral-storage: 2Gi
                  nvidia.com/gpu: "1"
                limits:
                  # 14 GB of safetensors pass through host memory while loading
                  memory: 24Gi
                  nvidia.com/gpu: "1"
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
