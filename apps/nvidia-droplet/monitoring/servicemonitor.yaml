---
# vLLM metrics (vllm:* — TTFT, inter-token latency, queue depth, KV-cache usage, prefix-cache hits)
# from every model, scraped by kube-prometheus-stack.
# InferenceService predictors: the HF runtime serves /metrics on 8080 but declares no container
# port, so scrape through the predictor Service instead of the Pod. No port/targetPort: those
# filter on declared container ports; without them every Service endpoint (:8080) is scraped.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inferenceservice-vllm
  namespace: models
spec:
  selector:
    matchLabels:
      component: predictor
  endpoints:
    - path: /metrics
      interval: 15s
