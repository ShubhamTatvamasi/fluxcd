---
# Models served behind one OpenAI-compatible endpoint, https://api.${domain}/v1, picked by the
# request's "model" field. To add a model: new folder (LLMInferenceService, or InferenceService +
# Backend + AIServiceBackend), list it here, and add a rule to route/aigatewayroute.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- monitoring
- route
- qwen-coder
- phi
