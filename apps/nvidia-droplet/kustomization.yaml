---
# Models served behind one OpenAI-compatible endpoint, https://litellm.${domain}/v1, picked by the
# request's "model" field. To add a model: new folder with an LLMInferenceService, list it here,
# and add a rule for its <name>-inference-pool to route/aigatewayroute.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- monitoring
- route
- qwen-coder
- phi
