---
# Qwen2.5-Coder 7B Instruct as an LLMInferenceService: KServe's llmisvc controller runs vLLM
# (llm-d image) plus llm-d's endpoint picker behind an InferencePool, from the kserve-config-llm-*
# presets. Tool calling is on, so IDE agent modes (Copilot, Continue, Cline) can use it.
# Call it through the shared endpoint: POST https://litellm.${domain}/v1/chat/completions
#   -H "Authorization: Bearer <LiteLLM virtual key>"  -d '{"model":"qwen-coder", ...}'
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: qwen-coder
  namespace: models
spec:
  model:
    # served name (vLLM --served-model-name); must match the AIGatewayRoute rule value
    name: qwen-coder
    uri: hf://Qwen/Qwen2.5-Coder-7B-Instruct
  replicas: 1
  # one shared GPU: the old vLLM pod must release its memory before the new one starts,
  # otherwise the new pod finds too little free memory and crash-loops
  rolloutStrategy:
    maxSurge: 0
    maxUnavailable: 1
  router:
    # llm-d endpoint picker + InferencePool "qwen-coder-inference-pool" (kserve-config-llm-scheduler)
    scheduler:
      template:
        containers:
          - name: main
            # the preset requests 1 CPU / 2Gi per picker; one model replica needs far less
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
    # KServe's own path routes (/models/qwen-coder/v1/...) on the default kserve-ingress-gateway;
    # clients use the AIGatewayRoute instead, these only match their own prefix
    route: {}
    gateway: {}
  template:
    containers:
      - name: main
        env:
          # the RHEL-based llm-d image bakes in TRITON_LIBCUDA_PATH=/usr/lib64, but on this Ubuntu node
          # the NVIDIA toolkit mounts the driver at /usr/lib/x86_64-linux-gnu; without this, Triton's
          # kernel build fails with "ld: cannot find -l:libcuda.so.1" and vLLM never starts
          - name: TRITON_LIBCUDA_PATH
            value: /usr/lib/x86_64-linux-gnu
          - name: VLLM_ADDITIONAL_ARGS
            # 50% of the 48GB card (~24GB): ~15GB bf16 weights, the rest KV cache (~154k tokens).
            # Time-slicing doesn't isolate memory; shares on the card must sum to < 1.0.
            # 64k context via static YaRN (factor 2 over the native 32k), ~2 full-length requests in
            # KV cache; agent-mode prompts (tool schemas + files) regularly exceed 32k. The JSON is
            # single-quoted because the llm-d launcher evals this string.
            # KV cache pinned to 8 GiB (~150k tokens): sized from free memory at startup, it grabs
            # whatever a neighbour is releasing at that moment (seen: 16 GiB while phi restarted).
            value: >-
              --gpu-memory-utilization=0.5
              --kv-cache-memory-bytes=8589934592
              --max-model-len=65536
              --hf-overrides='{"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":32768}}'
              --enable-auto-tool-choice
              --tool-call-parser=hermes
        resources:
          requests:
            cpu: "1"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 24Gi
            nvidia.com/gpu: "1"
