---
# Target of the "phi" rule in route/aigatewayroute.yaml, pointing at the phi Backend.
# The KServe Hugging Face runtime serves OpenAI under /openai/v1, not /v1, hence the prefix.
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: phi
  namespace: models
spec:
  schema:
    name: OpenAI
    prefix: /openai/v1
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: phi
