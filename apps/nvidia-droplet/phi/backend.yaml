---
# Where the "phi" rule of the AIGatewayRoute sends traffic: the InferenceService's predictor Service.
# The KServe Hugging Face runtime serves OpenAI under /openai/v1, not /v1, hence the prefix.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: phi
  namespace: models
spec:
  endpoints:
    - fqdn:
        hostname: phi-predictor.models.svc.cluster.local
        port: 80
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: phi
  namespace: models
spec:
  schema:
    name: OpenAI
    prefix: /openai/v1
  backendRef:
    group: gateway.envoyproxy.io
    kind: Backend
    name: phi
