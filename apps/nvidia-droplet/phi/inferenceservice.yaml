---
# Phi-3.5 mini Instruct (3.8B) on the Hugging Face runtime (vLLM backend), on a time-sliced GPU share.
# Call it through the shared endpoint: POST https://api.${domain}/v1/chat/completions
#   -H "Authorization: Bearer <key>"  -d '{"model":"phi", ...}'
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: phi
  namespace: models
spec:
  predictor:
    # the old pod must free its GPU memory before the new one starts
    deploymentStrategy:
      type: Recreate
    model:
      modelFormat:
        name: huggingface
      storageUri: hf://microsoft/Phi-3.5-mini-instruct
      args:
        # 45% of the 48GB card (~21GB): ~7.6GB weights, the rest KV cache
        - --gpu-memory-utilization=0.45
        # the 128k default context needs more KV cache than this share holds
        - --max-model-len=8192
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
