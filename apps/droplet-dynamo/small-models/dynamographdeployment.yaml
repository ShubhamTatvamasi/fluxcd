---
# Three small models behind one Dynamo Frontend, aggregated serving (each vLLM worker does prefill + decode):
#   qwen3-1.7b         Qwen/Qwen3-1.7B-FP8                 general chat, tool calls, optional thinking
#   qwen2.5-coder-1.5b Qwen/Qwen2.5-Coder-1.5B-Instruct    code
#   smollm2-1.7b       HuggingFaceTB/SmolLM2-1.7B-Instruct small general chat
# Service small-models-frontend:8000 (/v1/models, /v1/chat/completions) routes on the request's "model".
# Each worker registers on its own endpoint (<namespace>.<model>.generate), so the three never share instances.
#
# GPU: every worker uses the dynamo/gpu claim (MPS, 6Gi and 33% of the SMs per process). Under MPS CUDA still
# reports the whole card as total (19.55 GiB) and only the cap as free (5.94 GiB), and vLLM sizes from total,
# so --gpu-memory-utilization 0.27 (~5.3 GiB) keeps each worker inside its 6Gi with room for the CUDA context.
# vLLM measures its peak activations at startup and gives the KV cache what is left of that budget, logging the
# split (weights + CUDA context + peak activations + CUDA graphs + KV cache), which Portainer's model Internals tab
# shows. Don't pin the cache with --kv-cache-memory-bytes: vLLM then skips that measurement, so nothing checks the
# activations still fit under the MPS cap.
# Scheduling: the operator only injects KAI settings for Grove (multinode) workloads, so every pod sets
# schedulerName and the KAI queue label itself.
# Rollouts: a new worker can't fit next to the old one (the card is fully split), so a worker change needs the
# old pod deleted by hand, or the DGD removed and re-added.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: small-models
  namespace: dynamo
spec:
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            kai.scheduler/queue: inference
        spec:
          schedulerName: kai-scheduler
          containers:
            - name: main
              # the operator's webhook requires an image with a semver tag on every component
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi

    - name: Qwen3Worker
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            kai.scheduler/queue: inference
        spec:
          schedulerName: kai-scheduler
          resourceClaims:
            - name: gpu
              resourceClaimName: gpu
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
              workingDir: /workspace/examples/backends/vllm
              command: ["python3", "-m", "dynamo.vllm"]
              args:
                - --model
                - Qwen/Qwen3-1.7B-FP8
                - --served-model-name
                - qwen3-1.7b
                # $(DYN_NAMESPACE) is set by the operator and expanded by the kubelet
                - --endpoint
                - dyn://$(DYN_NAMESPACE).qwen3.generate
                # 1.9 GiB of FP8 weights (the output layer is tied to the embeddings, so loaded once);
                # a 2.68 GiB cache holds 25,072 tokens at 112 KiB/token, 1.5 requests of the full 16k
                - --gpu-memory-utilization
                - "0.27"
                - --max-model-len
                - "16384"
                - --max-num-seqs
                - "8"
                - --dyn-tool-call-parser
                - hermes
                - --dyn-reasoning-parser
                - qwen3
                # answer directly unless a request asks for thinking (chat_template_kwargs: {"enable_thinking": true})
                - --dyn-default-thinking-mode
                - disabled
              env:
                - name: HF_HOME
                  value: /home/dynamo/.cache/huggingface
              volumeMounts:
                - name: model-cache
                  mountPath: /home/dynamo/.cache/huggingface
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: 500m
                  # each worker holds ~3.4-4.1 GiB of host memory once loaded
                  memory: 4608Mi
                limits:
                  memory: 8Gi
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: CoderWorker
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            kai.scheduler/queue: inference
        spec:
          schedulerName: kai-scheduler
          resourceClaims:
            - name: gpu
              resourceClaimName: gpu
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
              workingDir: /workspace/examples/backends/vllm
              command: ["python3", "-m", "dynamo.vllm"]
              args:
                - --model
                - Qwen/Qwen2.5-Coder-1.5B-Instruct
                - --served-model-name
                - qwen2.5-coder-1.5b
                - --endpoint
                - dyn://$(DYN_NAMESPACE).coder.generate
                # 2.98 GiB of BF16 weights; a 1.33 GiB cache holds 49,824 tokens at 28 KiB/token,
                # 1.5 requests of the full 32k
                - --gpu-memory-utilization
                - "0.27"
                - --max-model-len
                - "32768"
                - --max-num-seqs
                - "8"
                - --dyn-tool-call-parser
                - hermes
              env:
                - name: HF_HOME
                  value: /home/dynamo/.cache/huggingface
              volumeMounts:
                - name: model-cache
                  mountPath: /home/dynamo/.cache/huggingface
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: 500m
                  # each worker holds ~3.4-4.1 GiB of host memory once loaded
                  memory: 4608Mi
                limits:
                  memory: 8Gi
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache

    - name: SmolLMWorker
      type: worker
      replicas: 1
      podTemplate:
        metadata:
          labels:
            kai.scheduler/queue: inference
        spec:
          schedulerName: kai-scheduler
          resourceClaims:
            - name: gpu
              resourceClaimName: gpu
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.6.1
              workingDir: /workspace/examples/backends/vllm
              command: ["python3", "-m", "dynamo.vllm"]
              args:
                - --model
                - HuggingFaceTB/SmolLM2-1.7B-Instruct
                - --served-model-name
                - smollm2-1.7b
                - --endpoint
                - dyn://$(DYN_NAMESPACE).smollm2.generate
                # 3.19 GiB of BF16 weights and no GQA (192 KiB/token): a 1.61 GiB cache holds 8,800 tokens,
                # barely one request of the model's full 8k, so stay at 4k (2 at once)
                - --gpu-memory-utilization
                - "0.27"
                - --max-model-len
                - "4096"
                - --max-num-seqs
                - "4"
              env:
                - name: HF_HOME
                  value: /home/dynamo/.cache/huggingface
              volumeMounts:
                - name: model-cache
                  mountPath: /home/dynamo/.cache/huggingface
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: 500m
                  # each worker holds ~3.4-4.1 GiB of host memory once loaded
                  memory: 4608Mi
                limits:
                  memory: 8Gi
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
