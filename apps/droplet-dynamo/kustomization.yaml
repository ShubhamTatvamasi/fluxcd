---
# Small models served by NVIDIA Dynamo on a third of the GPU each (MPS through a shared DRA claim), scheduled by
# KAI. One DynamoGraphDeployment, one Frontend: Service small-models-frontend:8000 in the dynamo namespace serves
# all three, picked by the request's "model" field (/v1/models lists them).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- model-cache.yaml
- resourceclaim.yaml
- queue.yaml
- small-models
