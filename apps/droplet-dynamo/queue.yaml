---
# KAI queue for the Dynamo pods (label kai.scheduler/queue: inference). Only leaf queues take jobs, so it sits
# under the chart's default-parent-queue. KAI gives Deployment pods the non-preemptible "inference" priority,
# and those only run within quota (never over it), so quota is -1 (unlimited), not 0 (nothing guaranteed).
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: inference
spec:
  parentQueue: default-parent-queue
  resources:
    cpu:
      quota: -1
      limit: -1
      overQuotaWeight: 1
    gpu:
      quota: -1
      limit: -1
      overQuotaWeight: 1
    memory:
      quota: -1
      limit: -1
      overQuotaWeight: 1
