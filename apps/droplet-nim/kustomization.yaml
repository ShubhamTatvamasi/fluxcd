---
# Models served by the NVIDIA NIM Operator (NIMService). To add a model: new folder with a NIMService pointing at
# ngc-secret / ngc-api-secret and draResources → resourceClaimName: gpu, then list it here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- ../../secrets/sealed-secrets/ngc
- resourceclaim.yaml
# off until the NGC account is entitled to pull nvcr.io/nim/* (key currently gets "PAYMENT_REQUIRED") and the tag is pinned
# - llama32-3b
# NIMService running the upstream vLLM image until then
- qwen25-3b
