---
# vLLM metrics (vllm:* — TTFT, inter-token latency, queue depth, KV-cache usage) for kube-prometheus-stack
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qwen25-3b
  namespace: nim
spec:
  selector:
    matchLabels:
      app: qwen25-3b
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
