---
# The droplet's one GPU, claimed once and shared: every model pod lists this claim (resourceClaimName),
# so they all land on the same card instead of each needing a device of its own. No memory isolation:
# each vLLM pod must cap itself with --gpu-memory-utilization so the shares add up to < 1.0 of the card.
# Sharing strategy needs the TimeSlicingSettings / MPSSupport feature gates on nvidia-dra-driver-gpu.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: gpu
  namespace: models
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
    config:
      - requests: ["gpu"]
        opaque:
          driver: gpu.nvidia.com
          parameters:
            apiVersion: resource.nvidia.com/v1beta1
            kind: GpuConfig
            sharing:
              # The GPU switches between processes; Long favours throughput over latency for LLM serving.
              strategy: TimeSlicing
              timeSlicingConfig:
                interval: Long # Default | Short | Medium | Long
              # MPS instead: processes run concurrently with a per-client SM share and memory cap.
              # vLLM still sizes itself against the full 20GB card, so --gpu-memory-utilization x 20GB
              # must stay under defaultPinnedDeviceMemoryLimit or it OOMs at startup.
              # strategy: MPS
              # mpsConfig:
              #   defaultActiveThreadPercentage: 50
              #   defaultPinnedDeviceMemoryLimit: 8Gi
