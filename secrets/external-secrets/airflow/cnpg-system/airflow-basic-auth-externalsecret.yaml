---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-basic-auth
  namespace: cnpg-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: airflow-basic-auth
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: cnpg/airflow-basic-auth
        property: username
    - secretKey: password
      remoteRef:
        key: cnpg/airflow-basic-auth
        property: password
