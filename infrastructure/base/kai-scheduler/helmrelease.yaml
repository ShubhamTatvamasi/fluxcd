---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kai-scheduler
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: kai-scheduler
  # No Helm wait: the KAI operator keeps a "Reconciling: True" condition on the Config and SchedulingShard
  # once reconciled, which kstatus reads as InProgress forever, so the install times out.
  install:
    crds: CreateReplace
    disableWait: true
  upgrade:
    crds: CreateReplace
    disableWait: true
  values:
    global:
      # Off: KAI's fractional GPU sharing reserves whole nvidia.com/gpu devices through its own
      # reservation pods, which needs the device plugin; GPUs here come from DRA ResourceClaims.
      gpuSharing: false
    admission:
      # RuntimeClass the admission webhook sets on GPU pods scheduled by KAI
      gpuPodRuntimeClassName: "${gpu_runtime_class}"
    # Pods opt in with schedulerName: kai-scheduler and a kai.scheduler/queue label. The chart creates
    # default-parent-queue/default-queue on first install only (quota 0); queues for real workloads live with
    # those workloads (e.g. apps/droplet-dynamo/queue.yaml).
    defaultQueue:
      createDefaultQueue: true
  # The chart ships kai-config as a pre-install/pre-upgrade hook, so every upgrade deletes and recreates it; that
  # garbage-collects the ServiceAccounts the operator owns under it and the scheduler pod (owned by the
  # SchedulingShard, not restarted) is left with a token for a deleted ServiceAccount: Unauthorized on every call.
  # As a plain release resource it is patched in place instead.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Config
              name: kai-config
            patch: |
              - op: remove
                path: /metadata/annotations/helm.sh~1hook
              - op: remove
                path: /metadata/annotations/helm.sh~1hook-weight
