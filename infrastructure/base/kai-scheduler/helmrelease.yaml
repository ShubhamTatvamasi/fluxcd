---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kai-scheduler
  namespace: kai-scheduler
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: kai-scheduler
    namespace: kai-scheduler
  # No Helm wait: the KAI operator keeps a "Reconciling: True" condition on the Config and SchedulingShard
  # once reconciled, which kstatus reads as InProgress forever, so the install times out.
  install:
    crds: CreateReplace
    disableWait: true
  upgrade:
    crds: CreateReplace
    disableWait: true
  values:
    global:
      # Off: KAI's fractional GPU sharing reserves whole nvidia.com/gpu devices through its own
      # reservation pods, which needs the device plugin; GPUs here come from DRA ResourceClaims.
      gpuSharing: false
    admission:
      # RuntimeClass the admission webhook sets on GPU pods scheduled by KAI
      gpuPodRuntimeClassName: "${gpu_runtime_class}"
    # Pods opt in with schedulerName: kai-scheduler and a kai.scheduler/queue label.
    # Non-preemptible pods (priority >= 100, e.g. "inference", KAI's default for Deployments) only run
    # within quota, and the chart's quota 0 guarantees nothing, so the parent queue gets quota -1 (unlimited)
    # for its child queues to use.
    defaultQueue:
      createDefaultQueue: true
      parentResources:
        cpu:
          quota: -1
          limit: -1
          overQuotaWeight: 1
        gpu:
          quota: -1
          limit: -1
          overQuotaWeight: 1
        memory:
          quota: -1
          limit: -1
          overQuotaWeight: 1
