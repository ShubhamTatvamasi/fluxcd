---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: monitoring
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorNamespaceSelector:
          matchLabels:
            monitoring: enabled
        serviceMonitorSelectorNilUsesHelmValues: false
        # remoteWrite:
        #   - url: http://mimir-gateway.mimir.svc.cluster.local/api/v1/push
        #     headers:
        #       X-Scope-OrgID: anonymous
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - prometheus.${domain}
        tls:
          - secretName: kube-prometheus-stack-tls
            hosts:
              - prometheus.${domain}
    grafana:
      adminUser: admin
      adminPassword: admin
      # plugins:
      #   - grafana-lokiexplore-app
      grafana.ini:
        auth.anonymous:
          enabled: true
          org_role: Viewer
        security:
          allow_embedding: true
        users:
          default_theme: light
      # Ceph's dashboard module hardcodes its Grafana panel URLs with
      # var-datasource=Dashboard1, so a datasource literally named
      # "Dashboard1" is required alongside the default "Prometheus" one.
      additionalDataSources:
        - name: Dashboard1
          type: prometheus
          access: proxy
          url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          isDefault: false
          editable: false
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.${domain}
        tls:
          - secretName: kube-prometheus-stack-tls
            hosts:
              - grafana.${domain}
