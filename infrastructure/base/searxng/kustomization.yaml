---
# SearXNG metasearch engine as an internal search API (no ingress) for Open WebUI's
# "Web Search using SearXNG" tool (infrastructure/droplet/open-webui/tools)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- searxng-secrets.yaml
- deployment.yaml
- service.yaml
configMapGenerator:
- name: searxng-settings
  files:
  - settings.yml
