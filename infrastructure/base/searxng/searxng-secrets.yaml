---
# searxng-secrets: server.secret_key (secret-key), handed to SearXNG as SEARXNG_SECRET; it refuses to
# start with the stock "ultrasecretkey"
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: searxng-secrets
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/searxng
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
