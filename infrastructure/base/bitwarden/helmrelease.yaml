---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  interval: 10m
  timeout: 15m
  chartRef:
    kind: HelmChart
    name: bitwarden
    namespace: bitwarden
  values:
    general:
      domain: bitwarden.${domain}
      gateway:
        enabled: true
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
      volumeAccessMode: ReadWriteOnce
    sharedStorageClassName: ""
    secrets:
      secretName: bitwarden-secret
