---
# Tells ceph-csi-operator to actually deploy the RBD/CephFS CSI plugin
# pods. Rook doesn't create these automatically when
# csi.installCsiOperator: true (see rook/rook#18081) — without them, no
# CSIDriver is registered and PVCs stay Pending with "waiting for a volume
# to be created ... verify that the provisioner is running and correctly
# registered".
#
# metadata.name must match ^(?:.+\.)?(rbd|cephfs|nfs|nvmeof)\.csi\.ceph\.com$
# — the operator parses the driver type out of the name itself.
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
spec:
  attachRequired: true
---
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.cephfs.csi.ceph.com
  namespace: rook-ceph
spec:
  attachRequired: true
