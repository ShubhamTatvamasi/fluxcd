---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ceph-dashboard
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ceph.${domain}`)
      kind: Rule
      services:
        - name: rook-ceph-mgr-dashboard
          port: 7000
          scheme: http
  tls:
    secretName: ceph-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ceph-s3
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ceph-s3.${domain}`)
      kind: Rule
      services:
        - name: rook-ceph-rgw-ceph-objectstore
          port: 80
  tls:
    secretName: ceph-tls
