---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: rook-ceph
    namespace: rook-ceph
  values:
    # Required for the operator's ClusterRole to include servicemonitors.
    # monitoring.enabled on the rook-ceph-cluster chart only enables Ceph's
    # own Prometheus rules/exporters — it doesn't grant this RBAC.
    monitoring:
      enabled: true
