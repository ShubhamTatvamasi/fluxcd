---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: rustfs
    namespace: rustfs
  values:
    # This cluster has 3 worker nodes; the chart's podAntiAffinity default
    # (one pod per node) means replicaCount can't exceed node count.
    # drivesPerNode is set explicitly since the chart only auto-infers 4
    # for the legacy replicaCount=4 case (anything else infers 1).
    replicaCount: 3
    drivesPerNode: 4
    secret:
      existingSecret: rustfs-credentials
    storageclass:
      name: ceph-filesystem
      dataStorageSize: 10Gi
      logStorageSize: 1Gi
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: "rustfs.${domain}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: true
        existingSecret:
          enabled: true
          name: rustfs-tls
