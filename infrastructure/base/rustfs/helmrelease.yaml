---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: rustfs
    namespace: rustfs
  values:
    secret:
      existingSecret: rustfs-credentials
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: "rustfs.${domain}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        enabled: true
        existingSecret:
          enabled: true
          name: rustfs-tls
