---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: stirling-pdf
    namespace: stirling-pdf
  values:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - name: stirling-pdf.${domain}
          path: /
          tls: true
          tlsSecret: stirling-pdf-tls
