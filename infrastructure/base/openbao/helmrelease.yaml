---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: openbao
    namespace: openbao
  values:
    replicaCount: 1

    image:
      registry: quay.io
      repository: openbao/openbao
      tag: "2.6.2"

    persistence:
      enabled: true
      size: 10Gi

    headlessService:
      # Needed for stable per-pod DNS (POD_NAME.openbao-vault-headless.<ns>.svc),
      # used by cluster_addr below -- raft's inter-node communication address.
      enabled: true

    extraInitContainers:
      # storage.raft.path (/vault/file/raft) must exist before the vault
      # container starts -- unlike the file backend, raft's bolt db open
      # fails outright ("no such file or directory") if its directory isn't
      # already there.
      - name: raft-data-dir
        image: quay.io/openbao/openbao:2.6.2
        command: ["sh", "-c", "mkdir -p /vault/file/raft"]
        volumeMounts:
          - name: vault-file
            mountPath: /vault/file

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - openbao.${domain}/
      tls:
        - secretName: openbao-tls
          hosts:
            - openbao.${domain}

    tls:
      secretName: openbao-tls

    unsealer:
      args:
        - "--mode"
        - "k8s"
        - "--k8s-secret-namespace"
        - "openbao"
        - "--k8s-secret-name"
        - "bank-vaults"

    vault:
      envs:
        # go-plugin's client (running inside the vault process itself) creates
        # its unix socket dir via os.MkdirTemp("", ...), which resolves to
        # os.TempDir() -- i.e. /tmp, which is unwritable under
        # containerSecurityContext.readOnlyRootFilesystem: true. Point it at
        # the already-writable persisted vault-file PVC instead.
        - name: TMPDIR
          value: "/vault/file/plugins"
        # raft's storage.cluster_addr has no chart-templated default (unlike
        # VAULT_API_ADDR above); OpenBao reads it from VAULT_CLUSTER_ADDR.
        # Needs the headless service (stable per-pod DNS) enabled above.
        - name: VAULT_CLUSTER_ADDR
          value: "https://$(POD_NAME).openbao-vault-headless.$(POD_NAMESPACE).svc:8201"
        # storage.raft.node_id below is a static placeholder -- this env var
        # overrides it with the actual per-pod name, needed if this ever
        # scales beyond one replica.
        - name: VAULT_RAFT_NODE_ID
          value: "$(POD_NAME)"

      config:
        disable_mlock: true
        # Reuses the persisted vault-file PVC (already mounted read-write into
        # the vault container) since the chart has no value to mount an extra
        # volume into the main container for a dedicated plugin path.
        plugin_directory: "/vault/file/plugins"
        plugin_auto_download: true
        plugin_auto_register: true
        listener:
          tcp:
            address: "[::]:8200"
            tls_disable: true
        defaultStorage:
          # Migrated from file storage (deprecated, removal planned for
          # v2.7.0) to raft. Path is a subdirectory under the existing
          # vault-file PVC mount -- the chart hardcodes that single mount
          # point, there's no value to get a separate /vault/raft mount.
          # node_id is a placeholder, overridden per-pod by
          # VAULT_RAFT_NODE_ID above.
          storage:
            # Helm deep-merges values files rather than replacing maps, so the
            # chart's own default defaultStorage.storage.file would otherwise
            # survive alongside raft below, producing two storage blocks and
            # a vault startup error. Explicitly null it out.
            file: null
            raft:
              path: "/vault/file/raft"
              node_id: "openbao-vault-0"
        plugin:
          auth:
            aws:
              image: "ghcr.io/openbao/openbao-plugin-auth-aws"
              version: "v0.1.1"
              binary_name: "openbao-plugin-auth-aws"
              sha256sum: "7a77057e62973c1aae6035f52110e3302605a47b622756d954915b7b55eca10c"
            azure:
              image: "ghcr.io/openbao/openbao-plugin-auth-azure"
              version: "v0.23.0"
              binary_name: "openbao-plugin-auth-azure"
              sha256sum: "e9f83fb05174ecbae16ec1e48eb40e2179f2d39459d63806251e543b723823fa"
            gcp:
              image: "ghcr.io/openbao/openbao-plugin-auth-gcp"
              version: "v0.22.0"
              binary_name: "openbao-plugin-auth-gcp"
              sha256sum: "e0d1a29aba54ff35e04ce7821b5c84c4f8049386c4a66536b82208b1177e84ff"
            github:
              image: "ghcr.io/openbao/openbao-plugin-auth-github"
              version: "v0.0.1"
              binary_name: "openbao-plugin-auth-github"
              sha256sum: "76a46b7680a974ff367df53b700af95565b88a70f01c10c512b36ec2ea7fe7fc"
          secret:
            aws:
              image: "ghcr.io/openbao/openbao-plugin-secrets-aws"
              version: "v0.3.1"
              binary_name: "openbao-plugin-secrets-aws"
              sha256sum: "641ae1858c0f660b4c3761286d627e1dcfd33dc35e7c83eb81ca9050b5bdc6d8"
            azure:
              image: "ghcr.io/openbao/openbao-plugin-secrets-azure"
              version: "v0.23.0"
              binary_name: "openbao-plugin-secrets-azure"
              sha256sum: "cd4e2e7b7f1f03e72d67594e27439255b46748948735ec3270ecc308068f2caa"
            gcp:
              image: "ghcr.io/openbao/openbao-plugin-secrets-gcp"
              version: "v0.23.1"
              binary_name: "openbao-plugin-secrets-gcp"
              sha256sum: "c31df4d547e4d98d70fc97ba77ce77993ffa09848ba929e45e9ee1dbbcab20f1"
            gcpkms:
