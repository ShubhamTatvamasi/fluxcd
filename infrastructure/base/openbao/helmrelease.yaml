---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: openbao
    namespace: openbao
  values:
    replicaCount: 1

    image:
      registry: quay.io
      repository: openbao/openbao
      tag: "2.6.2"

    persistence:
      enabled: true
      size: 10Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - openbao.${domain}/
      tls:
        - secretName: openbao-tls
          hosts:
            - openbao.${domain}

    tls:
      secretName: openbao-tls

    unsealer:
      args:
        - "--mode"
        - "k8s"
        - "--k8s-secret-namespace"
        - "openbao"
        - "--k8s-secret-name"
        - "bank-vaults"

    vault:
      config:
        disable_mlock: true
        listener:
          tcp:
            address: "[::]:8200"
            tls_disable: true
        defaultStorage:
          storage:
            file:
              path: "/vault/file"
