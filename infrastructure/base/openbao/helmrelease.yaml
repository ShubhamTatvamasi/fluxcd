---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: openbao
    namespace: openbao
  values:
    replicaCount: 1

    image:
      registry: quay.io
      repository: openbao/openbao
      tag: "2.6.2"

    persistence:
      enabled: true
      size: 10Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - openbao.${domain}/
      tls:
        - secretName: openbao-tls
          hosts:
            - openbao.${domain}

    tls:
      secretName: openbao-tls

    unsealer:
      args:
        - "--mode"
        - "k8s"
        - "--k8s-secret-namespace"
        - "openbao"
        - "--k8s-secret-name"
        - "bank-vaults"

    vault:
      externalConfig:
        policies:
          - name: allow_secrets
            rules: |
              path "secret/*" {
                capabilities = ["create", "read", "update", "delete", "list"]
              }

        auth:
          - type: kubernetes
            roles:
              - name: default
                bound_service_account_names: default
                bound_service_account_namespaces: default
                policies: allow_secrets
                ttl: 1h
          - type: auth-aws
            path: aws
            description: "AWS IAM/EC2 auth (openbao-plugins auth-aws)"
          - type: auth-azure
            path: azure
            description: "Azure auth (openbao-plugins auth-azure)"
          - type: auth-gcp
            path: gcp
            description: "GCP auth (openbao-plugins auth-gcp)"
          - type: auth-github
            path: github
            description: "GitHub auth (openbao-plugins auth-github)"

        secrets:
          - path: secret
            type: kv
            description: General secrets.
            options:
              version: 2
          - path: aws
            type: plugin
            plugin_name: secret-aws
            description: "AWS secrets engine (openbao-plugins secret-aws)"
          - path: azure
            type: plugin
            plugin_name: secret-azure
            description: "Azure secrets engine (openbao-plugins secret-azure)"
          - path: gcp
            type: plugin
            plugin_name: secret-gcp
            description: "GCP secrets engine (openbao-plugins secret-gcp)"
          - path: gcpkms
            type: plugin
            plugin_name: secret-gcpkms
            description: "GCP KMS secrets engine (openbao-plugins secret-gcpkms)"
          - path: nomad
            type: plugin
            plugin_name: secret-nomad
            description: "Nomad ACL token secrets engine (openbao-plugins secret-nomad)"
          - path: consul
            type: plugin
            plugin_name: secret-consul
            description: "Consul ACL token secrets engine (openbao-plugins secret-consul)"

      config:
        disable_mlock: true
        # Reuses the persisted vault-file PVC (already mounted read-write into
        # the vault container) since the chart has no value to mount an extra
        # volume into the main container for a dedicated plugin path.
        plugin_directory: "/vault/file/plugins"
        plugin_auto_download: true
        plugin_auto_register: true
        listener:
          tcp:
            address: "[::]:8200"
            tls_disable: true
        defaultStorage:
          storage:
            file:
              path: "/vault/file"
        plugin:
          auth:
            aws:
              image: "ghcr.io/openbao/openbao-plugin-auth-aws"
              version: "v0.1.1"
              binary_name: "openbao-plugin-auth-aws"
              sha256sum: "7a77057e62973c1aae6035f52110e3302605a47b622756d954915b7b55eca10c"
            azure:
              image: "ghcr.io/openbao/openbao-plugin-auth-azure"
              version: "v0.23.0"
              binary_name: "openbao-plugin-auth-azure"
              sha256sum: "e9f83fb05174ecbae16ec1e48eb40e2179f2d39459d63806251e543b723823fa"
            gcp:
              image: "ghcr.io/openbao/openbao-plugin-auth-gcp"
              version: "v0.22.0"
              binary_name: "openbao-plugin-auth-gcp"
              sha256sum: "e0d1a29aba54ff35e04ce7821b5c84c4f8049386c4a66536b82208b1177e84ff"
            github:
              image: "ghcr.io/openbao/openbao-plugin-auth-github"
              version: "v0.0.1"
              binary_name: "openbao-plugin-auth-github"
              sha256sum: "76a46b7680a974ff367df53b700af95565b88a70f01c10c512b36ec2ea7fe7fc"
          secret:
            aws:
              image: "ghcr.io/openbao/openbao-plugin-secrets-aws"
              version: "v0.3.1"
              binary_name: "openbao-plugin-secrets-aws"
              sha256sum: "641ae1858c0f660b4c3761286d627e1dcfd33dc35e7c83eb81ca9050b5bdc6d8"
            azure:
              image: "ghcr.io/openbao/openbao-plugin-secrets-azure"
              version: "v0.23.0"
              binary_name: "openbao-plugin-secrets-azure"
              sha256sum: "cd4e2e7b7f1f03e72d67594e27439255b46748948735ec3270ecc308068f2caa"
            gcp:
              image: "ghcr.io/openbao/openbao-plugin-secrets-gcp"
              version: "v0.23.1"
              binary_name: "openbao-plugin-secrets-gcp"
              sha256sum: "c31df4d547e4d98d70fc97ba77ce77993ffa09848ba929e45e9ee1dbbcab20f1"
            gcpkms:
