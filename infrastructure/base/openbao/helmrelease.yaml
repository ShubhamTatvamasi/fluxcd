              sha256sum: "0f8e436dfc543dd5e4756866bde3e20a93b69a0f5757d09d2fe1e41cd38f5ed7"
          database:
            mongodb:
              image: "ghcr.io/openbao/openbao-plugin-database-mongodb"
              version: "v0.0.1"
              binary_name: "openbao-plugin-database-mongodb"
              sha256sum: "2fc346826f30755136af974bcb42f0578747722cf49a7bb5c20c3fbb9eb01e47"
          kms:
            aws:
              image: "ghcr.io/openbao/openbao-plugin-kms-aws"
              version: "v0.1.0"
              binary_name: "openbao-plugin-kms-aws"
              sha256sum: "fa332cf1863a948d4b166ed9acb7da1608fb1dffbde4425626d787424fda5a05"
            azure:
              image: "ghcr.io/openbao/openbao-plugin-kms-azure"
              version: "v0.1.0"
              binary_name: "openbao-plugin-kms-azure"
              sha256sum: "e46a6d13ab427b594c89e58b002db6bbb6d61557f5de8a599557c76827deef0d"
            gcp:
              image: "ghcr.io/openbao/openbao-plugin-kms-gcp"
              version: "v0.1.0"
              binary_name: "openbao-plugin-kms-gcp"
              sha256sum: "4e480b95c18fc98cf7e682c197653c7845d229bfc44f93f9ef9fe56ff4a9f7d2"
            oci:
              image: "ghcr.io/openbao/openbao-plugin-kms-oci"
              version: "v0.1.0"
              binary_name: "openbao-plugin-kms-oci"
              sha256sum: "1d10812139a4a5f2fec52b9e18c3d1d3129fcea34fbab15bf6b7bbddd989f3e4"
            ovhcloud:
              image: "ghcr.io/openbao/openbao-plugin-kms-ovhcloud"
              version: "v0.0.1"
              binary_name: "openbao-plugin-kms-ovhcloud"
              sha256sum: "653ed969ae963caa3622c4505be401756a91c8cd2145ac83b83249648b60f76c"
            pkcs11:
              image: "ghcr.io/openbao/openbao-plugin-kms-pkcs11"
              version: "v0.2.0"
              binary_name: "openbao-plugin-kms-pkcs11"
              sha256sum: "21c1785caa0023024ae2db904479de198fd043b319eb6cc82feabe379f561409"
            alicloud:
              image: "ghcr.io/openbao/openbao-plugin-kms-alicloud"
              version: "v0.1.1"
              binary_name: "openbao-plugin-kms-alicloud"
              sha256sum: "94b660dc4cfbb68b766ac60b4e41643a17ecbae910b1da6b71c7aca91e750144"
            tcloudpublic:
