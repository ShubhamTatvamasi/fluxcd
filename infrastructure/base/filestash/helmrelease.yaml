---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filestash
  namespace: filestash
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: filestash
    namespace: filestash
  values:
    image:
      main:
        tag: "latest"
    main:
      options:
        application_url: "https://filestash.${domain}"
    resources:
      requests:
        main:
          storage: 1Gi
