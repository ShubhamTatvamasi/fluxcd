---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: vault
    namespace: vault
  values:
    replicaCount: 1

    image:
      tag: 2.1.0

    persistence:
      enabled: true
      size: 10Gi

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - vault.${domain}/
      tls:
        - secretName: vault-tls
          hosts:
            - vault.${domain}

    tls:
      secretName: vault-tls

    unsealer:
      args:
        - "--mode"
        - "k8s"
        - "--k8s-secret-namespace"
        - "vault"
        - "--k8s-secret-name"
        - "bank-vaults"

    vault:
      config:
        disable_mlock: true
        listener:
          tcp:
            address: "[::]:8200"
            tls_disable: true
        defaultStorage:
          storage:
            file:
              path: "/vault/file"
