---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: penpot
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: penpot
  # the chart no longer bundles postgres/redis; both come from sibling Kustomizations (postgres.yaml, valkey.yaml)
  dependsOn:
    - name: postgres
    - name: valkey
  values:
    config:
      publicUri: https://penpot.${domain}
      flags: "enable-registration enable-login-with-password disable-email-verification disable-smtp enable-mcp"
      telemetryEnabled: false
      existingSecret: penpot-secrets
      secretKeys:
        apiSecretKey: api-secret-key
      postgresql:
        host: postgres.penpot.svc.cluster.local
        port: 5432
        username: postgres
        database: penpot
        existingSecret: penpot-secrets
        secretKeys:
          passwordKey: postgres-password
      redis:
        host: valkey.penpot.svc.cluster.local
        port: 6379
        database: "0"
      # assets on the RWO PVC below (frontend + backend share it; fine on a single node)
      objectsStorage:
        storageBackend: fs
    persistence:
      assets:
        enabled: true
        size: 20Gi
    ingress:
      enabled: true
      className: traefik
      hosts:
        - penpot.${domain}
      tls:
        - hosts:
            - penpot.${domain}
          secretName: penpot-tls
