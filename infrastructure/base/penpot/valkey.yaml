---
# Valkey (Redis-compatible) for Penpot websocket notifications/pubsub, from the shared valkey base:
# Service valkey.penpot.svc:6379, no auth
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: penpot-valkey
spec:
  interval: 10m0s
  path: ./infrastructure/base/valkey
  targetNamespace: penpot
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
