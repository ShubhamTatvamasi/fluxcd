---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: postgres
  values:
    auth:
      password: "postgres"
      # optional (postBuild substitute): Secret holding the admin password under "postgres-password",
      # which then wins over the inline password above
      existingSecret: "${postgres_existing_secret:=}"
      # optional: database created at init (default: postgres)
      database: "${postgres_database:=}"
