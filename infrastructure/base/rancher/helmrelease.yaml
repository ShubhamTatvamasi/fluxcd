---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: rancher
  values:
    hostname: rancher.${domain}
    bootstrapPassword: admin
    ingress:
      ingressClassName: traefik
      tls:
        source: secret
        secretName: rancher-tls
    replicas: 1
