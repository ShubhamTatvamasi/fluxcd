---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: rook-ceph-cluster
    namespace: rook-ceph
  values:
    toolbox:
      enabled: true
    monitoring:
      enabled: true
    # Object storage (S3/RGW) isn't needed on this cluster — disabling it
    # removes the RGW pools/gateway entirely, which was also the source of
    # the TOO_MANY_PGS warning (its bucket-data pool's chart-default
    # bulk: "true" kept its PG count pinned high).
    cephObjectStores: []
