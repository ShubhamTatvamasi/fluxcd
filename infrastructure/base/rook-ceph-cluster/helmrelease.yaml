---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: rook-ceph-cluster
    namespace: rook-ceph
  values:
    toolbox:
      enabled: true
    monitoring:
      enabled: true
    cephClusterSpec:
      # Existing clusters are auto-promoted to keyGeneration 1 the moment any
      # key is first created, regardless of this feature ever being used —
      # so keyGeneration must be set strictly greater than 1 (the CRD only
      # rotates on keyGeneration > status.keyGeneration) to actually trigger
      # rotation on a pre-existing cluster like this one.
      security:
        cephx:
          # All entities have rotated to aes256k; disallow the legacy aes
          # cipher entirely so mons stop accepting/offering it.
          allowedCiphers:
            - aes256k
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
    # cephObjectStores is a list, so Helm replaces it wholesale rather than
    # deep-merging with the chart default — the full spec must stay here even
    # though only dataPool.parameters.bulk differs from the chart default.
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 1
            parameters:
              bulk: "false"
          preservePoolsOnDelete: true
          gateway:
            port: 80
            resources:
              limits:
                memory: "2Gi"
              requests:
                cpu: "1000m"
                memory: "1Gi"
            instances: 1
            priorityClassName: system-cluster-critical
        storageClass:
          enabled: true
          name: ceph-bucket
          parameters:
            region: us-east-1
