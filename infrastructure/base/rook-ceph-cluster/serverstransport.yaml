---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
spec:
  insecureSkipVerify: true
  # Ceph's dashboard dropped TLSv1.2 support (ceph/ceph#50494) and only
  # speaks TLSv1.3 now. Without pinning this, some requests intermittently
  # fail the handshake and surface as a 502 (see rook/rook#13449).
  minVersion: VersionTLS13
  maxVersion: VersionTLS13
  # Ceph's dashboard requires client certs (mgr/dashboard/ssl: true) and
  # pooled/reused connections intermittently fail the TLS handshake with
  # SSLV3_ALERT_BAD_CERTIFICATE, surfacing to the browser as a 500/502.
  # Disabling idle connection reuse forces a fresh handshake per request.
  maxIdleConnsPerHost: 0
