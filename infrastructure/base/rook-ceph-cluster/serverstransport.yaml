---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: ceph-dashboard
  namespace: rook-ceph
spec:
  # Traefik rejects minVersion == maxVersion as invalid and silently falls
  # back to its own default transport when that happens (visible as
  # "Falling back to default MaxVersion and MinVersion" in its logs) —
  # so only set a floor here, not an exact pin. Ceph's dashboard dropped
  # TLSv1.2 support (ceph/ceph#50494) and only speaks TLSv1.3.
  minVersion: VersionTLS13
  insecureSkipVerify: true
