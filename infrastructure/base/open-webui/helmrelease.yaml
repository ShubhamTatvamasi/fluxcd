---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: open-webui
    namespace: open-webui
  values:
    ingress:
      enabled: true
      class: traefik
      host: openwebui.${domain}
      tls: true
      existingSecret: open-webui-tls
    ollama:
      # host driver files only reach the pod via the "nvidia" RuntimeClass on NVIDIA; AMD needs none
      runtimeClassName: "${gpu_runtime_class:=}"
      ollama:
        gpu:
          enabled: true
          # amd -> ollama "-rocm" image; the GPU limit is rewritten to <vendor>.com/gpu.shared below
          type: ${gpu_vendor}
      persistentVolume:
        enabled: true
        size: 100Gi
  # Request a time-sliced <vendor>.com/gpu.shared slot instead of the whole GPU, so ollama
  # shares the card with gpustack. The chart hardcodes amd.com/gpu (only the NVIDIA name is
  # configurable), so swap the limit after rendering; null drops the chart's whole-GPU key.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: open-webui-ollama
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: open-webui-ollama
              spec:
                template:
                  spec:
                    containers:
                      - name: ollama
                        resources:
                          limits:
                            ${gpu_vendor}.com/gpu: null
                            ${gpu_vendor}.com/gpu.shared: 1
