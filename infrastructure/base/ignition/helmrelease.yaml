---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ignition
  namespace: ignition
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: ignition
    namespace: ignition
  values:
    commissioning:
      acceptIgnitionEULA: true
      edition: standard
      # admin password is randomly generated into the "ignition-gateway-admin-password" secret
    gateway:
      # chart default (1536Mi limit, heap at 75%) leaves too little off-heap room and OOMKills
      maxRAMPercentage: 50
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 6Gi
    ingress:
      enabled: true
      className: traefik
      hostOverride: ignition.${domain}
      customTLS:
        - secretName: ignition-tls
          hosts:
            - ignition.${domain}
