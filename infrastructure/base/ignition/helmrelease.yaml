---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ignition
  namespace: ignition
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: ignition
    namespace: ignition
  values:
    commissioning:
      acceptIgnitionEULA: true
      edition: standard
      # admin password is randomly generated into the "ignition-gateway-admin-password" secret
    ingress:
      enabled: true
      className: traefik
      hostOverride: ignition.${domain}
      customTLS:
        - secretName: ignition-tls
          hosts:
            - ignition.${domain}
