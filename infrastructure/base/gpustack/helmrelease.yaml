---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpustack
  namespace: gpustack-system
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: gpustack
    namespace: gpustack-system
  values:
    server:
      ingress:
        # host the bundled higress Ingress matches; traefik terminates TLS in front of it (see ingress.yaml)
        hostname: gpustack.${domain}
    higress-core:
      gateway:
        replicas: 1
        # traefik owns the node's LoadBalancer IP; higress sits behind it
        service:
          type: ClusterIP
          # gpustack's parent values set Local, which the API rejects on a ClusterIP service
          externalTrafficPolicy: ""
    worker:
      enabled: true
      # vendor DaemonSets need NFD's pci-<vendor>.present labels (NFD ships with the GPU operators)
      gpuVendors:
        - ${gpu_vendor}
      environmentConfig:
        # gpustack 2.2.3's runtime (0.2.1) looks for "feature.gpustack.ai/<manu>-*.profile-queue"
        # node labels, but the bundled operator v0.5.4 labels "*.z-queue" and names LocalQueues
        # "gpustack-fnv64-*", so every GPU model fails with "Failed to find Kueue queue name".
        # Skip Kueue admission; pods still request <vendor>.com/gpu and the scheduler places them.
        GPUSTACK_RUNTIME_KUBERNETES_KDP_NO_KUEUE_ADMISSION: "true"
