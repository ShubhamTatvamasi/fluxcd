---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: gpu-operator
    namespace: gpu-operator
  values:
    # RKE2 runs its own containerd; point the toolkit at its socket (https://docs.rke2.io/add-ons/gpu_operators)
    toolkit:
      env:
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
