---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: gpu-operator
    namespace: gpu-operator
  values:
    # DigitalOcean GPU images ship the NVIDIA driver and container toolkit, and RKE2
    # auto-detects /usr/bin/nvidia-container-runtime (adds the "nvidia" containerd runtime
    # and RuntimeClass). So the operator only runs device plugin, GFD, DCGM exporter and NFD.
    driver:
      enabled: true
      # enabled: false
    toolkit:
      enabled: true
      # enabled: false
      # only used if the toolkit is re-enabled: RKE2 runs its own containerd (https://docs.rke2.io/add-ons/gpu_operators)
      env:
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
    # Time-slice the single GPU so several model pods can each request nvidia.com/gpu: 1.
    # No memory isolation: every vLLM pod must cap itself with --gpu-memory-utilization so
    # the shares add up to < 1.0 of the card.
    devicePlugin:
      config:
        create: true
        name: time-slicing-config
        default: any
        data:
          any: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing:
                # a pod asking for 2 slices would still get one physical GPU, so refuse it
                failRequestsGreaterThanOne: true
                resources:
                  - name: nvidia.com/gpu
                    replicas: 4
    # Cloud GPUs are KVM pass-through, where the hypervisor blocks the profiling (DCP)
    # counters; any DCGM_FI_PROF_* field makes dcgm-exporter crash with "third-party
    # Profiling module returned an unrecoverable error". This is dcgm-exporter's
    # default-counters.csv with the DCGM_FI_PROF_* lines dropped.
    # dcgmExporter:
    #   config:
    #     name: dcgm-metrics-no-prof
    #     create: true
    #     data: |
    #       DCGM_FI_DEV_SM_CLOCK,                   gauge,   SM clock frequency (in MHz).
    #       DCGM_FI_DEV_MEM_CLOCK,                  gauge,   Memory clock frequency (in MHz).
    #       DCGM_FI_DEV_MEMORY_TEMP,                gauge,   Memory temperature (in C).
    #       DCGM_FI_DEV_GPU_TEMP,                   gauge,   GPU temperature (in C).
    #       DCGM_FI_DEV_POWER_USAGE,                gauge,   Power draw (in W).
    #       DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION,   counter, Total energy consumption since the driver was last reloaded (in mJ).
    #       DCGM_FI_DEV_PCIE_REPLAY_COUNTER,        counter, Total number of PCIe retries.
    #       DCGM_FI_DEV_GPU_UTIL,                   gauge,   GPU utilization (in %).
    #       DCGM_FI_DEV_MEM_COPY_UTIL,              gauge,   Memory utilization (in %).
    #       DCGM_FI_DEV_ENC_UTIL,                   gauge,   Encoder utilization (in %).
    #       DCGM_FI_DEV_DEC_UTIL,                   gauge,   Decoder utilization (in %).
    #       DCGM_FI_DEV_XID_ERRORS,                 gauge,   Value of the last XID error encountered.
    #       DCGM_FI_DEV_FB_FREE,                    gauge,   Framebuffer memory free (in MiB).
    #       DCGM_FI_DEV_FB_USED,                    gauge,   Framebuffer memory used (in MiB).
    #       DCGM_FI_DEV_FB_RESERVED,                gauge,   Framebuffer memory reserved (in MiB).
    #       DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL,     gauge,   Aggregate NVLink throughput across all lanes (in MB/s).
    #       DCGM_FI_DEV_VGPU_LICENSE_STATUS,        gauge,   vGPU License status
    #       DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for uncorrectable errors
    #       DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS,  counter, Number of remapped rows for correctable errors
    #       DCGM_FI_DEV_ROW_REMAP_FAILURE,          gauge,   Whether remapping of rows has failed
    #       DCGM_FI_DRIVER_VERSION,                 label,   Driver Version
