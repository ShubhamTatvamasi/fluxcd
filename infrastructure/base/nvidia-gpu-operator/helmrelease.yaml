---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: gpu-operator
    namespace: gpu-operator
  values:
    # DigitalOcean GPU images ship the NVIDIA driver and container toolkit, and RKE2
    # auto-detects /usr/bin/nvidia-container-runtime (adds the "nvidia" containerd runtime
    # and RuntimeClass). So the operator only runs device plugin, GFD, DCGM exporter and NFD.
    driver:
      enabled: false
    toolkit:
      enabled: false
      # only used if the toolkit is re-enabled: RKE2 runs its own containerd (https://docs.rke2.io/add-ons/gpu_operators)
      env:
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
