---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: airflow-infrastructure
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  inputs:
    # log/search store + its web UI, both in the opensearch namespace (its
    # Certificates need cert-manager's ClusterIssuer; the admin-credentials
    # secret needs vault-store/ESO to sync from Vault).
    - service: "opensearch"
      path: "./infrastructure/base/opensearch"
      dependsOn:
        - "cert-manager-config"
        - "vault-store"

    # grafana dashboard for airflow (ConfigMap picked up by kube-prometheus-stack)
    - service: "airflow-dashboard"
      path: "./infrastructure/base/airflow/airflow-dashboard"
      dependsOn:
        - "kube-prometheus-stack"

    # cnpg operator (installs the postgresql.cnpg.io CRDs)
    - service: "cnpg-operator"
      path: "./infrastructure/base/cnpg/operator"

    # basic-auth credentials for the cnpg cluster. Two interchangeable backends
    # live side by side under secrets/ — swap the path to
    # "./secrets/sealed-secrets/airflow/cnpg-system" (dependsOn "sealed-secrets"
    # instead of "vault-store") to source it from a SealedSecret instead.
    - service: "airflow-basic-auth"
      path: "./secrets/external-secrets/airflow/cnpg-system"
      dependsOn:
        - "vault-store"

    # cnpg cluster + pooler + database (needs the operator CRDs and the secret)
    - service: "cnpg-cluster"
      path: "./infrastructure/base/cnpg/cluster"
      dependsOn:
        - "cnpg-operator"
        - "airflow-basic-auth"

    # KEDA provides event-driven autoscaling (installs the keda.sh CRDs), used by
    # Airflow's Celery worker ScaledObject to scale workers on queued task count
    - service: "keda"
      path: "./infrastructure/base/keda"

    # Airflow's metadata DB connection string + KEDA connection variant. Swap
    # to "./secrets/sealed-secrets/airflow/airflow-metadata-connection"
    # (dependsOn "sealed-secrets" instead of "vault-store") to source from a SealedSecret.
    - service: "airflow-metadata-connection"
      path: "./secrets/external-secrets/airflow/airflow-metadata-connection"
      dependsOn:
        - "vault-store"

    # Airflow's Fernet key (encrypts Connections/Variables at rest). Swap to
    # "./secrets/sealed-secrets/airflow/airflow-fernet-key" (dependsOn
    # "sealed-secrets" instead of "vault-store") to source from a SealedSecret.
    - service: "airflow-fernet-key"
      path: "./secrets/external-secrets/airflow/airflow-fernet-key"
      dependsOn:
        - "vault-store"

    # Airflow's OpenSearch remote-log connection. Swap to
    # "./secrets/sealed-secrets/airflow/airflow-opensearch-connection"
    # (dependsOn "sealed-secrets" instead of "vault-store") to source from a SealedSecret.
    - service: "airflow-opensearch-connection"
      path: "./secrets/external-secrets/airflow/airflow-opensearch-connection"
      dependsOn:
        - "vault-store"

    # Bulk-imported Airflow Connections (connections.yaml), consumed by the
    # airflow-import CronJob. Swap to
    # "./secrets/sealed-secrets/airflow/airflow-import" (dependsOn
    # "sealed-secrets" instead of "vault-store") to source from a SealedSecret.
    - service: "airflow-connections-import"
      path: "./secrets/external-secrets/airflow/airflow-import"
      dependsOn:
        - "vault-store"

    # Env-var-style Airflow Connections (AIRFLOW_CONN_*). Swap to
    # "./secrets/sealed-secrets/airflow/airflow-connections" (dependsOn
    # "sealed-secrets" instead of "vault-store") to source from a SealedSecret.
    - service: "airflow-connections"
      path: "./secrets/external-secrets/airflow/airflow-connections"
      dependsOn:
        - "vault-store"
  resourcesTemplate: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.service >>
      namespace: flux-system
    spec:
      interval: 10m0s
      path: << inputs.path >>
      prune: true
      wait: true
      timeout: 10m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system

      <<- if index inputs "dependsOn" >>
      dependsOn:
        <<- range index inputs "dependsOn" >>
        - name: << . >>
          namespace: flux-system
        <<- end >>
      <<- end >>

      postBuild:
        substitute:
          domain: ${domain}
