---
# TLS terminates at traefik-gateway (websecure, traefik-tls cert);
# traffic to the core is plain HTTP on port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mistershell
  namespace: mistershell
  labels:
    app.kubernetes.io/name: mistershell
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - mistershell.${domain}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mistershell
          port: 80
