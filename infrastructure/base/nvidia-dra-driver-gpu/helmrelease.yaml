---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-dra-driver-gpu
  namespace: nvidia-dra-driver-gpu
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: nvidia-dra-driver-gpu
    namespace: nvidia-dra-driver-gpu
  values:
    # The GPU operator's driver container installs the driver under /run/nvidia/driver.
    # Use "/" on clusters where the driver is preinstalled on the host.
    nvidiaDriverRoot: /run/nvidia/driver
    # The GPU kubelet plugin stays off unless this is set; without it only ComputeDomains
    # are published and there are no gpu.nvidia.com ResourceSlices.
    gpuResourcesEnabledOverride: true
    resources:
      gpus:
        enabled: true
      # ComputeDomains are for multi-node NVLink (IMEX); not needed on single-GPU nodes.
      computeDomains:
        enabled: false
    # Alpha GPU sharing settings, picked per ResourceClaim through a GpuConfig (sharing.strategy):
    # TimeSlicing with a custom interval, or MPS (the plugin runs an MPS control daemon per claim).
    featureGates:
      TimeSlicingSettings: true
      MPSSupport: true
      # Watches NVML for XID/health events and drops a failing GPU from the ResourceSlice.
      NVMLDeviceHealthCheck: true
      # Off: MIG partitioning on demand; needs a MIG-capable GPU (A100/A30/H100/...), the RTX 4000 Ada isn't.
      # DynamicMIG: true
      # Off: hands GPUs to VMs (KubeVirt) via vfio-pci; needs IOMMU, which the droplet doesn't expose,
      # and mounts host /, /sys and /proc into the plugin.
      # PassthroughSupport: true
