---
# kserve-controller for InferenceService (needs cert-manager for its webhook certs)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-resources
  namespace: kserve
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: kserve-resources
    namespace: kserve
  values:
    kserve:
      version: v0.21.0
      # owns the shared inferenceservice-config, cert-manager Issuer and ClusterStorageContainer
      createSharedResources: true
      storage:
        # storage-initializer init container that downloads storageUri models; the 1Gi default
        # gets OOMKilled pulling hf:// models
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: "2"
      controller:
        # plain Deployments + HPA/KEDA instead of Knative
        deploymentMode: Standard
        gateway:
          # only used for the InferenceService status URL; requests are routed by the model's
          # AIGatewayRoute rule (apps/<cluster>/route), not by KServe-generated HTTPRoutes
          domain: api.${domain}
          pathTemplate: "/serving/{{ .Namespace }}/{{ .Name }}"
          # traefik terminates TLS in front of the gateway
          urlScheme: https
          disableIstioVirtualHost: true
          # KServe would add a catch-all "^/.*$" HTTPRoute on api.${domain} per InferenceService,
          # so a second model collides with the first; Envoy AI Gateway routes by "model" instead
          disableIngressCreation: true
          ingressGateway:
            # HTTPRoutes on the Envoy Gateway from the kserve/gateway layer instead of Ingresses
            enableGatewayApi: true
            kserveGateway: kserve/kserve-ingress-gateway
            createGateway: false
