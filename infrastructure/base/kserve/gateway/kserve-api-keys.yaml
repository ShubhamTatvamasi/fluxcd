---
# API key LiteLLM uses to call the KServe gateway, decrypted by sealed-secrets into Secret kserve/kserve-api-keys
# (data key = client name sent as x-client-id, value = its key); users get LiteLLM virtual keys instead
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kserve-api-keys
  namespace: kserve
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/kserve-api-keys
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
