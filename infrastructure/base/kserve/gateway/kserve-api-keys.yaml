---
# API keys for the KServe gateway, decrypted by sealed-secrets into Secret kserve/kserve-api-keys
# (each data key is a client name, its value is that client's API key)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kserve-api-keys
  namespace: kserve
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/kserve-api-keys
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
