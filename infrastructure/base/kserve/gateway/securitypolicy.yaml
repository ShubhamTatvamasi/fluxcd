---
# Every model behind kserve-ingress-gateway needs an API key, sent the OpenAI way
# ("Authorization: Bearer <key>", Envoy strips the Bearer prefix) or as "x-api-key: <key>".
# Requests without a valid key get 401 before reaching the model.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kserve-api-key-auth
  namespace: kserve
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kserve-ingress-gateway
  apiKeyAuth:
    credentialRefs:
      - kind: Secret
        name: kserve-api-keys
    extractFrom:
      - headers:
          - authorization
          - x-api-key
    # drop the key header before forwarding to the model
    sanitize: true
    # tell the model which client called (data key name of the matching API key)
    forwardClientIDHeader: x-client-id
