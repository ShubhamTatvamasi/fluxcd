---
# Envoy proxy stats (requests, latency, upstream errors per route) and the AI Gateway ext-proc
# sidecar's gen_ai.* metrics (token usage, time to first token per model) for the KServe gateway.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kserve-ingress-gateway
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: kserve-ingress-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
    - port: aigw-admin
      path: /metrics
      interval: 15s
