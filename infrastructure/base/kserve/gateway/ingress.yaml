---
apiVersion: networking.k8s.io/v1
kind: Ingress
# Public entry point: traefik terminates TLS and hands off to the Envoy proxy of kserve-ingress-gateway.
# Models are picked by the "model" field via an AIGatewayRoute: https://api.${domain}/v1/chat/completions
metadata:
  name: kserve-ingress-gateway
  namespace: envoy-gateway-system
spec:
  ingressClassName: traefik
  rules:
    - host: api.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kserve-ingress-gateway
                port:
                  number: 80
  tls:
    - secretName: kserve-ingress-gateway-tls
      hosts:
        - api.${domain}
