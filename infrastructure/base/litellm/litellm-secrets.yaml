---
# litellm-secrets: master key, Postgres user/password (postgres / postgres-password), UI admin login and the GATEWAY_API_KEY
# LiteLLM sends to the Envoy KServe gateway (the "litellm" client in kserve-api-keys)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/litellm
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
