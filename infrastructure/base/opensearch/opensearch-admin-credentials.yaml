---
# Two interchangeable backends live side by side under secrets/ — swap path
# to ./secrets/external-secrets/opensearch and dependsOn to vault-store to
# source this from Vault via ESO instead of Sealed Secrets.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opensearch-admin-credentials
  namespace: flux-system
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/opensearch
  postBuild:
    substitute:
      namespace: opensearch
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
