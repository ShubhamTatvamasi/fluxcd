---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infrastructure
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  inputs:
    # metallb provides load balancer services for the cluster
    - service: "metallb"
      path: "./infrastructure/base/metallb"

    # Sealed Secrets controller (needs to be installed before any sealed secrets can be decrypted)
    - service: "sealed-secrets"
      path: "./infrastructure/base/sealed-secrets"

    # flux web UI TLS (sealed secret decrypted by sealed-secrets)
    - service: "flux-tls"
      path: "./secrets/tls/shubhamtatvamasi-tls"
      tls_secret_name: "flux-tls"
      namespace: "flux-system"
      dependsOn:
        - "sealed-secrets"

    # metallb config (needs the metallb controller CRDs first)
    - service: "metallb-config"
      path: "./infrastructure/rke2-multi-node-rook-ceph/metallb-system"
      dependsOn:
        - "metallb"

    # Gateway API CRDs (needs the metallb config first)
    - service: "gateway-api"
      path: "./infrastructure/base/gateway-api"

    # Traefik — ingress controller (needs metallb and sealed-secrets to be installed first)
    - service: "traefik"
      path: "./infrastructure/base/traefik/controller"
      dependsOn:
        - "metallb-config"
        - "sealed-secrets"
        - "gateway-api"

    # traefik IngressRoute/Middleware CRs (need the traefik.io CRDs installed by the HelmRelease first)
    - service: "traefik-routes"
      path: "./infrastructure/base/traefik/routes"
      dependsOn:
        - "traefik"

    # dex OIDC provider (needs traefik and sealed-secrets)
    - service: "dex"
      path: "./infrastructure/base/dex"
      dependsOn:
        - "traefik"
        - "sealed-secrets"

    # oauth2-proxy needs dex to be up first, so it can configure the OIDC provider
    - service: "oauth2-proxy"
      path: "./infrastructure/base/oauth2-proxy"
      dependsOn:
        - "dex"

    # Rook — Ceph storage operator
    - service: "rook-ceph"
      path: "./infrastructure/base/rook-ceph/operator"

    # ceph-csi-drivers chart — creates the RBD/CephFS Driver CRs and their
    # ServiceAccounts/RBAC. rook-ceph's chart only vendors the ceph-csi-operator
    # controller as a subchart; it does not install this chart, so it must be
    # installed separately (see rook/rook#18081) or PVCs on ceph-block /
    # ceph-filesystem stay Pending with no CSI plugin pods ever scheduled.
    - service: "ceph-csi-operator"
      path: "./infrastructure/base/rook-ceph/ceph-csi-operator"
      dependsOn:
        - "rook-ceph"

    # kube-prometheus-stack provides monitoring, and backs the ceph dashboard's
    # metrics/graphs tab (needs traefik and sealed-secrets). Deployed before
    # rook-ceph-cluster now: its chart's monitoring.createPrometheusRules:
    # true makes rook-ceph-cluster render a PrometheusRule object, which
    # needs the monitoring.coreos.com CRDs this chart installs — without
    # this ordering, rook-ceph-cluster's Helm install fails outright with
    # "no matches for kind PrometheusRule". Prometheus/Grafana's own PVCs
    # just stay Pending until ceph-block exists from rook-ceph-cluster
    # afterwards — PVC binding is lazy, so this isn't a hard dependency the
    # other direction.
    - service: "kube-prometheus-stack"
      path: "./infrastructure/base/kube-prometheus-stack"
      dependsOn:
        - "traefik"
        - "sealed-secrets"

    # Rook — Ceph cluster (needs the rook-ceph operator and CRDs installed first; also
    # exposes the ceph dashboard via a Traefik IngressRoute, so traefik and sealed-secrets
    # must be up too; needs kube-prometheus-stack for the PrometheusRule CRD, see above)
    - service: "rook-ceph-cluster"
      path: "./infrastructure/base/rook-ceph/rook-ceph-cluster"
      dependsOn:
        - "rook-ceph"
        - "ceph-csi-operator"
        - "traefik"
        - "sealed-secrets"
        - "kube-prometheus-stack"

    # One-shot Job wiring the Ceph mgr dashboard's embedded Grafana panels
    # to this cluster's Grafana (no CephCluster/Helm field for this exists —
    # see grafana-dashboard-url/job.yaml for details). Its own Kustomization
    # because the Job's shell script is full of ${VAR} shell variables that
    # Flux's strict-mode postBuild.substitute can't tell apart from real
    # substitution variables — skipSubstitute avoids that, at the cost of
    # the domain being hardcoded in the Job instead of using ${domain}.
    - service: "grafana-dashboard-url"
      path: "./infrastructure/base/rook-ceph/grafana-dashboard-url"
      skipSubstitute: true
      dependsOn:
        - "rook-ceph-cluster"
        - "kube-prometheus-stack"

    # Ceph Grafana dashboards (upstream ceph-mixin), auto-discovered by the
    # kube-prometheus-stack Grafana sidecar via the grafana_dashboard label —
    # needs the monitoring namespace/sidecar from kube-prometheus-stack.
    # skipSubstitute: the dashboard JSON is full of Grafana's own $variable
    # templating ($cluster, $pool, $application, ...) which Flux's strict-mode
    # envsubst tries to resolve as postBuild substitutions and fails on.
    - service: "rook-ceph-dashboards"
      path: "./infrastructure/base/rook-ceph/rook-ceph-dashboards"
      skipSubstitute: true
      dependsOn:
        - "kube-prometheus-stack"
        - "rook-ceph-cluster"

    # Portainer — container/Kubernetes management UI (needs traefik and
    # sealed-secrets; ceph-block from rook-ceph-cluster is this cluster's
    # default StorageClass for its PVC)
    - service: "portainer"
      path: "./infrastructure/base/portainer"
      dependsOn:
        - "traefik"
        - "sealed-secrets"
        - "rook-ceph-cluster"

    # MinIO Operator — manages MinIO Tenant custom resources (Silo:
    # https://silo.pgsty.com/operations/deployments/k8s-deploy-minio-tenant-helm-on-kubernetes/)
    # - service: "minio-operator"
    #   path: "./infrastructure/base/minio-operator"

    # MinIO Tenant — S3-compatible object store deployed via the Operator's
    # Tenant chart; needs the operator's CRDs/controller, ceph-block from
    # rook-ceph-cluster for its PVCs, and traefik/sealed-secrets for the
    # console's TLS ingress
    # - service: "minio-tenant"
    #   path: "./infrastructure/base/minio-tenant"
    #   dependsOn:
    #     - "minio-operator"
    #     - "rook-ceph-cluster"
    #     - "traefik"
    #     - "sealed-secrets"

    # RustFS — standalone S3-compatible object store (Rust-based, unrelated
    # to MinIO/Silo): https://artifacthub.io/packages/helm/rustfs/rustfs
    # (needs ceph-filesystem from rook-ceph-cluster for its PVCs, and
    # traefik/sealed-secrets for its ingress TLS)
    # - service: "rustfs"
    #   path: "./infrastructure/base/rustfs"
    #   dependsOn:
    #     - "rook-ceph-cluster"
    #     - "traefik"
    #     - "sealed-secrets"
  resourcesTemplate: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.service >>
      namespace: flux-system
    spec:
      interval: 10m0s
      path: << inputs.path >>
      prune: true
      wait: true
      timeout: 10m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system

      <<- if index inputs "dependsOn" >>
      dependsOn:
        <<- range index inputs "dependsOn" >>
        - name: << . >>
        <<- end >>
      <<- end >>

      <<- if not (index inputs "skipSubstitute") >>
      postBuild:
        substitute:
          domain: "${domain}"
          <<- if index inputs "tls_secret_name" >>
          tls_secret_name: "<< index inputs "tls_secret_name" >>"
          namespace: "<< index inputs "namespace" >>"
          <<- end >>
      <<- end >>
