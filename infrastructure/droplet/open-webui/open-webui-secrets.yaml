# open-webui-secrets: the LiteLLM virtual key (litellm-api-key) Open WebUI sends as OPENAI_API_KEY
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui-secrets
  namespace: open-webui
spec:
  dependsOn:
  - name: sealed-secrets
    namespace: flux-system
  force: false
  interval: 10m0s
  path: ./secrets/sealed-secrets/open-webui
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 10m
  wait: true
