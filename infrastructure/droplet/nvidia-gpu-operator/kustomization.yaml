---
# GPU operator from base, without the device plugin: on this cluster GPUs are allocated through DRA
# (nvidia-dra-driver-gpu, gpu.nvidia.com ResourceClaims), and running both would advertise the same card
# twice (nvidia.com/gpu and gpu.nvidia.com) with neither side seeing the other's allocations.
# Driver, toolkit, GFD, DCGM exporter and NFD stay on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/nvidia-gpu-operator
patches:
- target:
    kind: HelmRelease
    name: gpu-operator
  patch: |-
    - op: replace
      path: /spec/values/devicePlugin
      value:
        enabled: false
    # The dynamo/gpu claim runs the card under MPS, which puts it in Exclusive_Process compute mode: only the
    # MPS server may open a context, so the validator's vectorAdd (not an MPS client) fails with "CUDA-capable
    # device(s) is/are busy or unavailable" whenever the operator re-validates (upgrades, driver restarts) and
    # the release never gets Ready. Skip that workload test; the driver and toolkit validations still run.
    - op: add
      path: /spec/values/validator
      value:
        cuda:
          env:
            - name: WITH_WORKLOAD
              value: "false"
