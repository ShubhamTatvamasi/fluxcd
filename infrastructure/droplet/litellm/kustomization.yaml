---
# LiteLLM from base as the public API for the Dynamo models (https://litellm.${domain}/v1, UI at /ui):
# virtual keys, users/teams, budgets, rate limits and spend tracking. The base model list points at the
# KServe gateway, so replace the whole proxy_config with the Dynamo frontend (apps/droplet-dynamo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/litellm
patches:
- target:
    kind: HelmRelease
    name: litellm
  patch: |-
    - op: replace
      path: /spec/values/proxy_config
      value:
        # all three models are served by one DynamoGraphDeployment behind the small-models-frontend:8000
        # Service, which routes on the request's "model" (the --served-model-name of each worker)
        model_list:
          - model_name: qwen3-1.7b
            litellm_params:
              model: qwen3-1.7b
              api_base: http://small-models-frontend.dynamo.svc.cluster.local:8000/v1
              # the Dynamo frontend has no auth (only reachable in-cluster); the openai client still wants a key
              api_key: none
            model_info:
              supports_function_calling: true
              supports_reasoning: true
              # 16384-token window (--max-model-len) split so prompt + reply always fit
              max_input_tokens: 12288
              max_output_tokens: 4096
          - model_name: qwen2.5-coder-1.5b
            litellm_params:
              model: qwen2.5-coder-1.5b
              api_base: http://small-models-frontend.dynamo.svc.cluster.local:8000/v1
              api_key: none
            model_info:
              supports_function_calling: true
              # 32768-token window (--max-model-len) split so prompt + reply always fit
              max_input_tokens: 28672
              max_output_tokens: 4096
          - model_name: smollm2-1.7b
            litellm_params:
              model: smollm2-1.7b
              api_base: http://small-models-frontend.dynamo.svc.cluster.local:8000/v1
              api_key: none
            model_info:
              # 4096-token window (--max-model-len) split so prompt + reply always fit
              max_input_tokens: 3072
              max_output_tokens: 1024
        litellm_settings:
          # drop OpenAI params a backend doesn't support instead of failing the request
          drop_params: true
          # Prometheus metrics on /metrics, readable without a key so Portainer can scrape them
          callbacks: ["prometheus"]
          require_auth_for_metrics_endpoint: false
          # smollm2 only holds 4k tokens (--max-model-len=4096); longer chats are retried on qwen3-1.7b (16k)
          context_window_fallbacks:
            - smollm2-1.7b: ["qwen3-1.7b"]
        router_settings:
          # check prompt size against model_info.max_input_tokens before calling, so an oversized
          # request goes straight to the fallback instead of failing on smollm2 first
          enable_pre_call_checks: true
        general_settings:
          master_key: os.environ/PROXY_MASTER_KEY
          # no UI sign-in with the shared UI_USERNAME/UI_PASSWORD (or master key); admins log in with
          # their own accounts (invited via /invitation/new). The master key still works for the API.
          disable_env_credential_login: true
          # models added in the UI are stored in Postgres
          store_model_in_db: true
