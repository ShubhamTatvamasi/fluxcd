---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: infrastructure
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  inputs:
    # local-path-provisioner provides a default storage class for the cluster
    - service: "local-path-provisioner"
      path: "./infrastructure/base/local-path-provisioner"

    # sealed-secrets encrypts secrets so they can be stored in Git safely
    - service: "sealed-secrets"
      path: "./infrastructure/base/sealed-secrets"

    # flux web UI TLS (sealed secret decrypted by sealed-secrets)
    - service: "flux-tls"
      path: "./secrets/sealed-secrets/tls/shubhamtatvamasi-tls"
      tls_secret_name: "flux-tls"
      namespace: "flux-system"
      dependsOn:
        - "sealed-secrets"

    # cert-manager issues and renews TLS certificates (installs its own CRDs); the AMD GPU operator needs it for its webhooks
    - service: "cert-manager"
      path: "./infrastructure/base/cert-manager/controller"

    # cert-manager ClusterIssuers + internal CA (need the cert-manager.io CRDs first)
    - service: "cert-manager-config"
      path: "./infrastructure/base/cert-manager/config"
      dependsOn:
        - "cert-manager"

    # cilium LB-IPAM pool holding the droplet's public IP (CRDs ship with rke2-cilium)
    - service: "cilium-lb-config"
      path: "./infrastructure/nvidia-droplet/kube-system"

    # gateway-api CRDs
    - service: "gateway-api"
      path: "./infrastructure/base/gateway-api"

    # traefik ingress controller (needs the cilium LB config first)
    - service: "traefik"
      path: "./infrastructure/base/traefik/controller"
      dependsOn:
        - "cilium-lb-config"
        - "sealed-secrets"
        - "gateway-api"

    # traefik IngressRoute/Middleware CRs (need the traefik.io CRDs installed by the HelmRelease first)
    - service: "traefik-routes"
      path: "./infrastructure/base/traefik/routes"
      dependsOn:
        - "traefik"

    # dex OIDC provider (needs traefik and sealed-secrets)
    - service: "dex"
      path: "./infrastructure/base/dex"
      dependsOn:
        - "traefik"
        - "sealed-secrets"

    # oauth2-proxy guards the traefik dashboard; needs dex up first to configure the OIDC provider
    - service: "oauth2-proxy"
      path: "./infrastructure/base/oauth2-proxy"
      dependsOn:
        - "dex"

    # portainer is a web UI for managing containers and Kubernetes clusters (needs traefik, local-path-provisioner, and sealed-secrets)
    - service: "portainer"
      path: "./infrastructure/base/portainer"
      dependsOn:
        - "traefik"
        - "local-path-provisioner"
        - "sealed-secrets"

    # AMD GPU operator — used by the amd-droplet cluster instead
    # - service: "amd-gpu-operator"
    #   path: "./infrastructure/base/amd-gpu-operator"
    #   dependsOn:
    #     - "cert-manager"

    # NVIDIA GPU operator: driver (skipped if preinstalled on the host), container toolkit, device plugin, DCGM exporter and NFD
    - service: "nvidia-gpu-operator"
      path: "./infrastructure/base/nvidia-gpu-operator"

    # GPUStack — GPU cluster manager for serving models (needs NFD labels from the GPU operator, traefik, local-path-provisioner, and sealed-secrets)
    # - service: "gpustack"
    #   path: "./infrastructure/base/gpustack"
    #   dependsOn:
    #     - "nvidia-gpu-operator"
    #     - "traefik"
    #     - "local-path-provisioner"
    #     - "sealed-secrets"

    # Open WebUI — chat UI with a bundled Ollama running on the node's GPU (needs the GPU operator, traefik, local-path-provisioner, and sealed-secrets)
    # - service: "open-webui"
    #   path: "./infrastructure/base/open-webui"
    #   dependsOn:
    #     - "nvidia-gpu-operator"
    #     - "traefik"
    #     - "local-path-provisioner"
    #     - "sealed-secrets"

    # Envoy Gateway CRDs (EnvoyProxy, BackendTrafficPolicy, ...); Gateway API + GIE CRDs come from gateway-api
    - service: "envoy-gateway-crds"
      path: "./infrastructure/base/envoy-gateway/crds"
      dependsOn:
        - "gateway-api"

    # Envoy Gateway controller, wired to the AI Gateway extension server for InferencePool backends
    - service: "envoy-gateway"
      path: "./infrastructure/base/envoy-gateway/controller"
      dependsOn:
        - "envoy-gateway-crds"

    # Envoy AI Gateway CRDs (AIGatewayRoute, AIServiceBackend, QuotaPolicy, ...)
    - service: "envoy-ai-gateway-crds"
      path: "./infrastructure/base/envoy-gateway/ai-gateway/crds"
      dependsOn:
        - "envoy-gateway-crds"

    # Envoy AI Gateway controller (needs cert-manager for its webhook cert)
    - service: "envoy-ai-gateway"
      path: "./infrastructure/base/envoy-gateway/ai-gateway/controller"
      dependsOn:
        - "envoy-ai-gateway-crds"
        - "envoy-gateway"
        - "cert-manager"

    # KServe CRDs (InferenceService, ServingRuntime, InferenceGraph, ClusterStorageContainer) and the kserve namespace
    - service: "kserve-crds"
      path: "./infrastructure/base/kserve/crds/kserve"

    # KServe LLMInferenceService CRDs (after kserve-crds so ClusterStorageContainer stays owned by kserve-crd)
    - service: "kserve-llmisvc-crds"
      path: "./infrastructure/base/kserve/crds/llmisvc"
      dependsOn:
        - "kserve-crds"

    # KServe Gateway on Envoy (GatewayClass, EnvoyProxy, Gateway) exposed through traefik at api.${domain}
    - service: "kserve-gateway"
      path: "./infrastructure/base/kserve/gateway"
      dependsOn:
        - "kserve-crds"
        - "envoy-gateway"
        - "envoy-ai-gateway"
        - "traefik"
        - "sealed-secrets"

    # KServe controller for InferenceService in Standard mode (needs cert-manager for webhook certs)
    - service: "kserve-controller"
      path: "./infrastructure/base/kserve/controller"
      dependsOn:
        - "kserve-crds"
        - "cert-manager"
        - "kserve-gateway"

    # KServe LLMInferenceService controller (needs the shared config from kserve-controller and the gateway-api/GIE CRDs)
    - service: "kserve-llmisvc"
      path: "./infrastructure/base/kserve/llmisvc"
      dependsOn:
        - "kserve-llmisvc-crds"
        - "kserve-controller"
        - "gateway-api"

    # KServe ClusterServingRuntimes and LLMInferenceServiceConfig presets (validated by both controllers' webhooks)
    - service: "kserve-runtimes"
      path: "./infrastructure/base/kserve/runtimes"
      dependsOn:
        - "kserve-controller"
        - "kserve-llmisvc"
  resourcesTemplate: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.service >>
      namespace: flux-system
    spec:
      interval: 10m0s
      path: << inputs.path >>
      prune: true
      wait: true
      timeout: 10m
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system

      <<- if index inputs "dependsOn" >>
      dependsOn:
        <<- range index inputs "dependsOn" >>
        - name: << . >>
        <<- end >>
      <<- end >>

      postBuild:
        substitute:
          domain: "${domain}"
          traefik_lb_ip: "${traefik_lb_ip}"
          gpu_vendor: "${gpu_vendor}"
          gpu_runtime_class: "${gpu_runtime_class}"
          <<- if index inputs "tls_secret_name" >>
          tls_secret_name: "<< index inputs "tls_secret_name" >>"
          namespace: "<< index inputs "namespace" >>"
          <<- end >>
